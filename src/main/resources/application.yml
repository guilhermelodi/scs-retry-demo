spring:
  application:
    name: scs-retry-demo
  cloud:
    stream:
      defaultBinder: kafka
      bindings:
        order-created-out-0:
          destination: order-created
          contentType: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8081}
